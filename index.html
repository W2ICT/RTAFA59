  rules_version = '2';
  service cloud.firestore {
    match /databases/{database}/documents {
      function signedIn() { return request.auth != null && request.auth.token.email == 'class59@chanor59.app'; }

<script type="module">
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const arabic = s => String(s ?? '').replace(/[๐-๙]/g, c => String(c.charCodeAt(0)-0xE50));
const esc = s => arabic(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- ตั้งค่า Firebase (แก้เฉพาะส่วนนี้) ---------- */

const SHARED_EMAIL = "class59@chanor59.app";   // บัญชีกลางของรุ่น (สร้างใน Authentication > Users)

/* ---------- storage (Firebase: Auth รหัสกลาง + Firestore) ---------- */
const DEMO = new URLSearchParams(location.search).has('demo');   // ?demo=1 = ทดลองในหน่วยความจำ ไม่ต่อ Firebase
const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
async function firebaseBackend(){
  if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('YOUR')) throw new Error('NOCONFIG');
  const { initializeApp } = await import(SDK + 'firebase-app.js');
  const A = await import(SDK + 'firebase-auth.js');
  const F = await import(SDK + 'firebase-firestore.js');
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  const fs = F.initializeFirestore(app, { localCache: F.persistentLocalCache({ tabManager: F.persistentMultipleTabManager() }) });
  const col = n => F.collection(fs, n);
  return {
    onAuth: cb => A.onAuthStateChanged(auth, u => cb(!!u)),
    login: pin => A.signInWithEmailAndPassword(auth, SHARED_EMAIL, PW_PREFIX + pin),
    logout: () => A.signOut(auth),
    subscribe(cb){
      const st = { contacts: [], docs: [] };
      const fire = () => cb({ contacts: st.contacts, docs: st.docs });
      const onErr = e => toast('อ่านข้อมูลไม่ได้: ' + (e.code || e.message));
      const u1 = F.onSnapshot(col('contacts'), q => { st.contacts = q.docs.map(d => ({ ...d.data(), id: d.id })); fire(); }, onErr);
      const u2 = F.onSnapshot(col('docs'), q => { st.docs = q.docs.map(d => ({ ...d.data(), id: d.id })); fire(); }, onErr);
      return () => { u1(); u2(); };
    },
    put: (c, rec) => F.setDoc(F.doc(fs, c, rec.id), rec),
    del: (c, id) => F.deleteDoc(F.doc(fs, c, id)),
  };
}
function memoryBackend(){
  const st = { contacts: [], docs: [] }; let authCb = () => {}, sub = null, ok = false;
  const fire = () => sub && sub({ contacts: [...st.contacts], docs: [...st.docs] });
  return {
    onAuth: cb => { authCb = cb; cb(ok); return () => {}; },
    login: async pin => { if (pin !== '5259') throw { code: 'auth/invalid-credential' }; ok = true; authCb(true); },
    logout: async () => { ok = false; authCb(false); },
    subscribe(cb){ sub = cb; fire(); return () => { sub = null; }; },
    put: async (c, rec) => { st[c] = st[c].filter(x => x.id !== rec.id).concat(rec); fire(); },
    del: async (c, id) => { st[c] = st[c].filter(x => x.id !== id); fire(); },
  };
}

};

/* ---------- birthdays ---------- */
function nextBirthday(iso, today){
  const [y,m,d] = iso.split('-').map(Number);
  const mk = yr => { const dt = new Date(yr, m-1, d); if (m===2 && d===29 && dt.getMonth()!==1) return new Date(yr,1,28); return dt; };
  let n = mk(today.getFullYear());
  if (n < today) n = mk(today.getFullYear()+1);
  return { date:n, days:Math.round((n - today)/86400000), age:n.getFullYear()-y };
}
function bdList(){
  const t = new Date(); t.setHours(0,0,0,0);
  return contacts.filter(c=>c.birthday).map(c=>({c, ...nextBirthday(c.birthday,t)})).sort((a,b)=>a.days-b.days);
}
const bdCount = () => bdList().filter(x=>x.days<=7).length;

}

    ${extra}${c.phone?`<a class="call" href="tel:${esc(c.phone)}" data-stop aria-label="โทร">${IC.phone}</a>`:''}</div></div>`;

function unitList(){
  const m = new Map();
  for (const c of contacts){ const k = c.unit || 'ไม่ระบุหน่วย'; const g = m.get(k) || {n:0, ord:c.ord ?? 1e6}; g.n++; g.ord = Math.min(g.ord, c.ord ?? 1e6); m.set(k,g); }
  return [...m].sort((x,y)=> x[1].ord-y[1].ord || x[0].localeCompare(y[0],'th'));
}
function vPhone(){
  const q = query.trim().toLowerCase();
  const units = unitList();
  if (unitFilter && !units.some(u=>u[0]===unitFilter)) unitFilter = '';
  const sel = `<select class="unitsel" id="unitSel"><option value="">หน่วยงาน: ทั้งหมด (${contacts.length})</option>${units.map(([k,g])=>`<option value="${esc(k)}"${k===unitFilter?' selected':''}>${esc(k)} (${g.n})</option>`).join('')}</select>`;
  const list = contacts.filter(c => (!unitFilter || (c.unit||'ไม่ระบุหน่วย')===unitFilter) && (!q || [c.rank,c.name,c.nickname,c.position,c.unit,c.phone,c.phone2,c.email,c.note].join(' ').replace(/[๐-๙]/g,x=>String(x.charCodeAt(0)-0xE50)).toLowerCase().includes(q)));
  if (!list.length) return sel + `<div class="empty">${contacts.length?'ไม่พบรายชื่อที่ค้นหา':'ยังไม่มีรายชื่อ<br>กดปุ่ม + เพิ่ม'}</div>`;
  const groups = new Map();
  for (const c of list){ const k = c.unit || 'ไม่ระบุหน่วย'; if(!groups.has(k)) groups.set(k, []); groups.get(k).push(c); }
  const ordOf = v => Math.min(...v.map(c=>c.ord ?? 1e6));
  return sel + [...groups].sort((x,y)=> ordOf(x[1])-ordOf(y[1]) || x[0].localeCompare(y[0],'th'))
    .map(([k,v])=>`<div class="letter">${esc(k)} · ${v.length}</div>` + v.sort((x,y)=>x.name.localeCompare(y.name,'th')).map(c=>contactRow(c)).join('')).join('');
}
function fileExt(d){ const m = /\.([a-z0-9]+)$/i.exec(d.fileName||''); return m ? m[1].slice(0,4).toUpperCase() : 'FILE'; }
const docYear = d => +d.year || (d.date ? +d.date.slice(0,4)+543 : 0);
function vDocs(){

    .sort((x,y)=>{ const a=val(x), b=val(y); const c = typeof a==='number' ? a-b : a.localeCompare(b,'th'); return (c||x.title.localeCompare(y.title,'th'))*sortDir; });
  const chips = `<div class="chips">${cats.map(c=>`<button class="chip ${c===docCat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>`;

  if (!list.length) return chips + bar + `<div class="empty">${docs.length?'ไม่พบเอกสาร':'ยังไม่มีเอกสาร'}</div>`;

function vBday(){
  const all = bdList();
  if (!all.length) return `<div class="empty">ยังไม่มีข้อมูลวันเกิด<br>ระบุวันเกิดในหน้าแก้ไขรายชื่อสมุดโทรศัพท์</div>`;
  const seg = `<div class="seg"><button data-bd="soon" class="${bdView==='soon'?'on':''}">ใกล้ถึง</button><button data-bd="month" class="${bdView==='month'?'on':''}">แยกตามเดือน</button></div>`;
  const today = all.filter(x=>x.days===0);
  const badge = x => x.days===0 ? `<div class="badge today">วันนี้</div>` : `<div class="badge ${x.days<=7?'soon':''}">อีก ${x.days} วัน</div>`;
  const line = x => contactRow(x.c, badge(x)).replace('</div></div></div>', `</div></div></div>`).replace(/(<div class="s">)([^<]*)/, `$1${x.date.getDate()} ${MS[x.date.getMonth()]} · ครบ ${x.age} ปี`);
  if (bdView==='soon'){
    const hero = today.length ? `<div class="hero"><b>วันนี้วันเกิด</b><br>${today.map(x=>esc(fullName(x.c))).join(', ')}</div>` : '';
    return seg + hero + all.map(line).join('');
  }
  const t = new Date(); let out = seg;
  const byM = Array.from({length:12},()=>[]);
  all.forEach(x=>byM[+x.c.birthday.split('-')[1]-1].push(x));
  byM.forEach((arr,i)=>{ if(!arr.length) return;
    out += `<div class="letter">${MONTHS[i]}${i===t.getMonth()?' (เดือนนี้)':''}</div>` +
      arr.sort((a,b)=>+a.c.birthday.split('-')[2]-+b.c.birthday.split('-')[2]).map(x=>{
        const d = +x.c.birthday.split('-')[2];
        return contactRow(x.c, `<div class="badge">${d} ${MS[i]}</div>`);
      }).join('');
  });
  return out;
}

/* ---------- ทำเนียบ นตท. (ข้อมูลจาก https://w2ict.github.io/AFAPS.Database/) ---------- */
const NTT_URL = 'https://w2ict.github.io/AFAPS.Database/';
const NTT_MINE = 52;                       // รุ่นของเรา (ไฮไลต์ในตารางรุ่น)
const SVC_MAIN = ['ทบ.', 'ทร.', 'ทอ.', 'ตร.'];
const SVC_FULL = { 'ทบ.': 'กองทัพบก', 'ทร.': 'กองทัพเรือ', 'ทอ.': 'กองทัพอากาศ', 'ตร.': 'สำนักงานตำรวจแห่งชาติ' };
const OTHER = '·อื่น·';
const ntt = { rows: null, loading: false, err: '', svc: '', view: 'run', run: null, cap: 100, runs: [], meta: new Map() };
const nf = n => Number(n).toLocaleString('en-US');

function nttLoadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลดตัวแตกไฟล์ไม่สำเร็จ')); document.head.append(s); });
}
async function nttInflate(b64){
  const bs = atob(b64), bin = new Uint8Array(bs.length);
  for (let i = 0; i < bs.length; i++) bin[i] = bs.charCodeAt(i);
  if (typeof DecompressionStream === 'function'){
    const stream = new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  if (!window.pako) await nttLoadScript('https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js');
  return window.pako.inflate(bin, { to: 'string' });
}
async function loadNtt(force){
  if (ntt.loading || (ntt.rows && !force)) return;
  ntt.loading = true; ntt.err = ''; render();
  try{
    let b64 = null;
    if (!force) try{ b64 = localStorage.getItem('ntt-b64'); }catch{}
    if (!b64){
      const res = await fetch(NTT_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('โหลดไม่สำเร็จ (HTTP ' + res.status + ')');
      const m = /<script[^>]*id="d"[^>]*>([\s\S]*?)<\/script>/.exec(await res.text());
      if (!m) throw new Error('ไม่พบข้อมูลในหน้าเว็บทำเนียบ');
      b64 = m[1].trim();
      try{ localStorage.setItem('ntt-b64', b64); }catch{}
    }
    const txt = await nttInflate(b64);
    const rows = [], meta = new Map();
    for (const line of txt.split('\n')){
      if (!line) continue;
      const p = line.split('\t');
      const r = { id: +p[0], fn: p[1] || '', ln: p[2] || '', run: +p[3], br: p[4] || '', ofn: p[5] || '', oln: p[6] || '', note: p[7] || '' };
      r.nm = (r.fn + ' ' + r.ln).trim() || '(ไม่มีข้อมูลชื่อ)';
      r.hay = (r.fn + r.ln + r.ofn + r.oln + r.note).replace(/\s+/g, '');
      rows.push(r);
      let m2 = meta.get(r.run); if (!m2){ m2 = { n: 0, svc: {} }; meta.set(r.run, m2); }
      m2.n++; m2.svc[r.br] = (m2.svc[r.br] || 0) + 1;
    }
    if (!rows.length) throw new Error('ข้อมูลว่างเปล่า');
    ntt.rows = rows; ntt.meta = meta; ntt.runs = [...meta.keys()].sort((a, b) => a - b);
  }catch(e){
    ntt.err = e.message || String(e);
    try{ localStorage.removeItem('ntt-b64'); }catch{}
  }
  ntt.loading = false; render();
}
const nttMatchSvc = r => !ntt.svc || (ntt.svc === OTHER ? !SVC_MAIN.includes(r.br) : r.br === ntt.svc);
const nttSvcLabel = v => !v ? 'ทุกเหล่า' : v === OTHER ? 'อื่น ๆ' : v;
function nttRunCount(run){
  const m = ntt.meta.get(run); if (!m) return 0;
  if (!ntt.svc) return m.n;
  if (ntt.svc === OTHER) return Object.entries(m.svc).reduce((t, [k, v]) => t + (SVC_MAIN.includes(k) ? 0 : v), 0);
  return m.svc[ntt.svc] || 0;
}
function nttList(){
  const q = query.trim().replace(/\s+/g, '');
  let L = ntt.rows.filter(nttMatchSvc);
  if (q) L = L.filter(r => r.hay.includes(q) || String(r.id).includes(q));
  else if (ntt.run != null) L = L.filter(r => r.run === ntt.run);
  return L;
}
function nttTitle(){
  const q = query.trim();
  if (q) return 'ผลค้นหา "' + q + '"';
  return ntt.run != null ? 'รุ่น ' + ntt.run : '';
}
function nttRow(r){
  const old = (r.ofn || r.oln) ? ' · ชื่อเดิม ' + [r.ofn, r.oln].filter(Boolean).join(' ') : '';
  return `<div class="card"><div class="row" style="cursor:default"><div class="grow"><div class="t">${esc(r.nm)}</div>
    <div class="s">รุ่น ${r.run} · ${esc(r.br || 'ไม่ระบุเหล่า')} · เลขประจำตัว ${r.id}${esc(old)}${r.note ? ' · ' + esc(r.note) : ''}</div></div></div></div>`;
}
function vNtt(){
  if (ntt.err) return `<div class="empty">โหลดทำเนียบไม่สำเร็จ<br><span class="s">${esc(ntt.err)}</span><br><br><button class="btn p" style="display:inline-block;flex:none;padding:8px 20px" data-nretry>ลองใหม่</button></div>`;
  if (!ntt.rows) return `<div class="empty">กำลังโหลดทำเนียบ นตท. ...</div>`;
  const chips = ['', ...SVC_MAIN, OTHER].map(v => `<button class="chip ${ntt.svc === v ? 'on' : ''}" data-nsvc="${esc(v)}">${esc(nttSvcLabel(v))}</button>`).join('');
  let out = `<div class="chips">${chips}</div>`;
  const q = query.trim();
  if (q || ntt.run != null){
    const L = nttList();
    const shown = L.slice(0, ntt.cap);
    out += `<div class="bar">${q ? '' : '<button class="btn" style="flex:none;padding:7px 14px;font-size:14px" data-nback>← รุ่นทั้งหมด</button>'}
      <div class="grow"><div class="t">${esc(nttTitle())}</div><div class="s">${nf(L.length)} คน${ntt.svc ? ' · ' + esc(nttSvcLabel(ntt.svc)) : ''}</div></div>
      <button class="btn" style="flex:none;padding:7px 12px;font-size:14px" data-nexp="pdf">PDF</button>
      <button class="btn" style="flex:none;padding:7px 12px;font-size:14px" data-nexp="xls">Excel</button></div>`;
    if (!L.length) return out + `<div class="empty">ไม่พบรายชื่อ</div>`;
    out += shown.map(nttRow).join('');
    if (L.length > shown.length) out += `<button class="btn more" data-nmore>แสดงเพิ่ม (อีก ${nf(L.length - shown.length)} คน)</button>`;
    return out;
  }
  out += `<div class="seg"><button data-nview="run" class="${ntt.view === 'run' ? 'on' : ''}">ตามรุ่น</button><button data-nview="svc" class="${ntt.view === 'svc' ? 'on' : ''}">ตามเหล่า</button></div>`;
  if (ntt.view === 'svc'){
    const tot = {}; let other = 0;
    for (const r of ntt.rows){ tot[r.br] = (tot[r.br] || 0) + 1; if (!SVC_MAIN.includes(r.br)) other++; }
    out += [...SVC_MAIN, OTHER].map(v => {
      const n = v === OTHER ? other : (tot[v] || 0);
      return `<div class="card"><div class="row" data-nsvcgo="${esc(v)}"><div class="grow"><div class="t">${esc(v === OTHER ? 'อื่น ๆ' : v + ' ' + SVC_FULL[v])}</div><div class="s">${nf(n)} คน</div></div></div></div>`;
    }).join('');
    return out;
  }
  out += `<div class="grid">${ntt.runs.map(n => {
    const c = nttRunCount(n);
    return `<button class="gcell ${n === NTT_MINE ? 'mine' : ''}" data-nrun="${n}" ${c ? '' : 'disabled'}><b>รุ่น ${n}</b><span>${nf(c)} คน${n === NTT_MINE ? ' · รุ่นเรา' : ''}</span></button>`;
  }).join('')}</div>`;
  return out;
}
function nttFileName(ext){
  const parts = ['ทำเนียบนตท'];
  if (ntt.run != null) parts.push('รุ่น' + ntt.run);
  if (ntt.svc) parts.push(ntt.svc === OTHER ? 'อื่นๆ' : ntt.svc.replace('.', ''));
  if (query.trim()) parts.push('ค้นหา');
  return parts.join('_') + '.' + ext;
}
function nttExport(kind){
  const L = nttList(); if (!L.length) return toast('ไม่มีข้อมูลให้ส่งออก');
  if (kind === 'xls'){
    const cols = ['เลขประจำตัว', 'ชื่อ', 'นามสกุล', 'รุ่น', 'เหล่า', 'ชื่อเดิม', 'นามสกุลเดิม', 'หมายเหตุ'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const csv = '﻿' + [cols.map(q).join(','), ...L.map(r => [r.id, r.fn, r.ln, r.run, r.br, r.ofn, r.oln, r.note].map(q).join(','))].join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = nttFileName('csv'); a.click();
    toast('ส่งออก ' + nf(L.length) + ' รายการ (เปิดด้วย Excel ได้)');
    return;
  }
  if (L.length > 3000 && !confirm('รายการมี ' + nf(L.length) + ' คน การพิมพ์เป็น PDF อาจช้า ต้องการทำต่อหรือไม่?')) return;
  const title = 'ทำเนียบ นตท. ' + [nttTitle(), ntt.svc ? nttSvcLabel(ntt.svc) : ''].filter(Boolean).join(' · ');
  const html = `<!doctype html><meta charset="utf-8"><title>${esc(title)}</title>
    <style>body{font-family:Sarabun,'Tahoma',sans-serif;font-size:11pt;margin:14mm}h1{font-size:15pt;margin:0 0 4mm}table{border-collapse:collapse;width:100%}th,td{border:1px solid #888;padding:2px 6px;text-align:left}th{background:#eee}tr{page-break-inside:avoid}</style>
    <h1>${esc(title)} (${nf(L.length)} คน)</h1>
    <table><thead><tr><th>#</th><th>เลขประจำตัว</th><th>ชื่อ - นามสกุล</th><th>รุ่น</th><th>เหล่า</th><th>หมายเหตุ</th></tr></thead><tbody>${
      L.map((r, i) => `<tr><td>${i + 1}</td><td>${r.id}</td><td>${esc(r.nm)}</td><td>${r.run}</td><td>${esc(r.br)}</td><td>${esc([(r.ofn || r.oln) ? 'ชื่อเดิม ' + [r.ofn, r.oln].filter(Boolean).join(' ') : '', r.note].filter(Boolean).join(' · '))}</td></tr>`).join('')
    }</tbody></table>`;
  const f = document.createElement('iframe'); f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.append(f);
  f.contentDocument.open(); f.contentDocument.write(html); f.contentDocument.close();
  setTimeout(() => { f.contentWindow.focus(); f.contentWindow.print(); setTimeout(() => f.remove(), 2000); }, 300);
}

/* ---------- events ---------- */
document.addEventListener('click', e=>{
  const t = e.target;
  if (t.closest('[data-stop]')) return;
  let el;
  if ((el=t.closest('[data-tab]'))){ tab=el.dataset.tab; query=''; $('#q').value=''; if (tab==='ntt'){ ntt.run=null; ntt.cap=100; } render(); scrollTo(0,0); if (tab==='ntt') loadNtt(); }
  else if ((el=t.closest('[data-nsvc]'))){ ntt.svc=el.dataset.nsvc; ntt.cap=100; render(); }
  else if ((el=t.closest('[data-nsvcgo]'))){ ntt.svc=el.dataset.nsvcgo; ntt.view='run'; ntt.run=null; ntt.cap=100; render(); scrollTo(0,0); }
  else if ((el=t.closest('[data-nrun]'))){ ntt.run=+el.dataset.nrun; ntt.cap=100; render(); scrollTo(0,0); }
  else if ((el=t.closest('[data-nview]'))){ ntt.view=el.dataset.nview; render(); }
  else if (t.closest('[data-nback]')){ ntt.run=null; ntt.cap=100; render(); }
  else if (t.closest('[data-nmore]')){ ntt.cap+=100; render(); }
  else if ((el=t.closest('[data-nexp]'))) nttExport(el.dataset.nexp);
  else if (t.closest('[data-nretry]')) loadNtt(true);
  else if ((el=t.closest('[data-open]'))) contactDetail(el.dataset.open);
  else if ((el=t.closest('[data-edit]'))) docForm(el.dataset.edit);
  else if ((el=t.closest('[data-doc]'))) openDoc(el.dataset.doc);
  else if ((el=t.closest('[data-sort]'))){ const k=el.dataset.sort; if(sortKey===k) sortDir=-sortDir; else { sortKey=k; sortDir=k==='year'?-1:1; } render(); }
  else if ((el=t.closest('[data-cat]'))){ docCat=el.dataset.cat; render(); }
  else if ((el=t.closest('[data-bd]'))){ bdView=el.dataset.bd; render(); }
});
$('#addBtn').onclick = ()=> tab==='phone' ? contactForm() : (isAdmin ? docForm() : adminLogin(docForm));
$('#menuBtn').onclick = menu;
document.addEventListener('change', e=>{ if (e.target.id==='unitSel'){ unitFilter = e.target.value; render(); } });
$('#q').addEventListener('input', e=>{ query=arabic(e.target.value); ntt.cap=100; $('#view').innerHTML = ({phone:vPhone,docs:vDocs,ntt:vNtt})[tab]?.() ?? ''; });

/* ---------- เริ่มต้น: ล็อกอินรหัสกลาง แล้วค่อยโหลดข้อมูล ---------- */
const gate = $('#gate');
const gateMsg = t => { $('#gateMsg').textContent = t || ''; };
function showGate(msg){ gate.hidden = false; gateMsg(msg); setTimeout(() => $('#pin').focus(), 50); }
let unsub = null;
$('#pinToggle').addEventListener('click', () => {
  const p = $('#pin'), show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('#pinToggle').textContent = show ? 'ซ่อน' : 'แสดง';
  $('#pinToggle').setAttribute('aria-label', show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  p.focus();
});
$('#gateForm').addEventListener('submit', async e => {
  e.preventDefault();
  if (!backend) return;
  const pin = $('#pin').value.trim(); if (!pin) return;
  gateMsg('กำลังตรวจสอบ...');
  try { await backend.login(pin); $('#pin').value = ''; gateMsg(''); }
  catch (err) { gateMsg(/invalid|wrong|credential|user-not-found/.test(err.code || '') ? 'รหัสไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ: ' + (err.code || err.message)); }
});
(async () => {
  try { backend = DEMO ? memoryBackend() : await firebaseBackend(); }
  catch (e) {
    if (e.message === 'NOCONFIG'){
      showGate('ยังไม่ได้ตั้งค่า Firebase — แก้ firebaseConfig ใน index.html ก่อน (คำแนะนำอยู่ด้านบนของไฟล์)');
      const a = document.createElement('a'); a.href = '?demo=1'; a.textContent = 'ลองใช้โหมดสาธิต (รหัส 5259 ข้อมูลไม่ถูกบันทึก)'; a.style.cssText = 'display:block;margin-top:10px;color:inherit';
      $('#gateMsg').append(a);
    } else showGate('เชื่อมต่อ Firebase ไม่ได้: ' + e.message);
    render(); return;
  }
  backend.onAuth(ok => {
    if (ok){ gate.hidden = true; unsub = backend.subscribe(d => { contacts = d.contacts; docs = d.docs; render(); }); }
    else { if (unsub) unsub(); unsub = null; contacts = []; docs = []; showGate(); render(); }
  });
  render();
})();
window.__app = { ntt, loadNtt, nttList, get contacts(){ return contacts; }, get docs(){ return docs; }, render, restore, setTab: t => { tab = t; render(); }, get isAdmin(){ return isAdmin; } };
</script>
